<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Fever Dream Books — Series Bookshelf</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 10%, #3d2f24 0%, #231a13 65%, #16100b 100%);
    color: #f6eedb;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    padding: 36px 24px 60px;
  }
  header { text-align: center; max-width: 780px; margin: 0 auto 38px; }
  .badge {
    display: inline-block;
    background: linear-gradient(90deg, #b98b24, #f5db82, #c89b2c);
    color: #211505;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.2em;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
    text-decoration: none;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .badge:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }
  h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); color: #fff8e7; }
  header p { margin: 10px 0 0; font-size: 16px; color: #d8c6a6; font-style: italic; }

  .shelf-grid {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }
  .shelf-book {
    display: flex;
    text-decoration: none;
    color: #fff8e7;
    background: var(--book-bg);
    border-radius: 5px 12px 12px 5px;
    overflow: hidden;
    min-height: 340px;
    box-shadow: 0 18px 34px rgba(0, 0, 0, 0.55), 0 4px 0 #d5c3a1;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .shelf-book:hover {
    transform: translateY(-6px) rotate(-0.6deg);
    box-shadow: 0 26px 44px rgba(0, 0, 0, 0.65), 0 4px 0 #f3d37a;
  }
  .mini-spine {
    width: 28px;
    flex-shrink: 0;
    background: linear-gradient(90deg, #7d5b10, #f5db82 40%, #b98b24 72%, #7d5b10);
    border-right: 2px solid rgba(50, 32, 4, 0.5);
  }
  .mini-cover {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mini-top {
    display: flex;
    justify-content: space-between;
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--book-accent);
  }
  .mini-title { font-size: 18px; font-weight: 700; line-height: 1.15; text-align: center; }
  .mini-art {
    flex: 1;
    background: #f6eedb;
    padding: 5px;
    border-radius: 5px;
    overflow: hidden;
    display: flex;
  }
  .mini-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
  .shelf-ph {
    flex: 1;
    display: grid;
    place-items: center;
    color: #7c684d;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    border: 1px dashed #b99e70;
  }
  .mini-cast {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    text-align: center;
    color: rgba(255, 248, 231, 0.85);
  }
  .empty-shelf {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 24px;
    border: 2px dashed rgba(243, 211, 122, 0.35);
    border-radius: 12px;
    color: #d8c6a6;
  }
</style>
</head>
<body>
  <header>
    <a class="badge" href="../meme-yearbook/index.html">MEME VALLEY HIGH SCHOOL &bull; CLASS OF 2025</a>
    <h1>Little Fever Dream Books</h1>
    <p>Thin hardboard classics with gold-foil spines, deadpan 1950s narration, and deeply questionable decisions.</p>
  </header>
  <main class="shelf-grid">
    
            <a class="shelf-book" href="books/01-the-very-big-world-problem/index.html"
               style="--book-bg: #c89027; --book-accent: #fff4d6;">
              <div class="mini-spine"></div>
              <div class="mini-cover">
                <div class="mini-top">
                  <span>No. 01</span>
                  <span>25¢</span>
                </div>
                <div class="mini-title">The Very Big World Problem</div>
                <div class="mini-art"><img src="books/01-the-very-big-world-problem/art/cover.png" alt="The Very Big World Problem"></div>
                <div class="mini-cast">Chester Antialiased • Marisol Brittle • Winston Crumb</div>
              </div>
            </a>
  </main>
</body>
</html>
